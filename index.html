<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다낭 여행 가이드</title>
<style>
  :root {
    --sea: #0e7c86; --sea-deep: #0a5a62; --lantern: #f0913e;
    --sand: #faf7f2; --card: #ffffff; --ink: #1f2933;
    --dim: #6b7684; --line: #e8e2d8; --ok: #2e9e5b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    background: var(--sand); color: var(--ink); line-height: 1.6; padding-bottom: 40px; }
  header { background: linear-gradient(135deg, var(--sea) 0%, var(--sea-deep) 100%);
    color: #fff; padding: 26px 18px 20px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12); }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  header p { font-size: 13px; opacity: 0.85; margin-top: 3px; }
  .tabs { display: flex; gap: 7px; overflow-x: auto; margin-top: 16px; padding-bottom: 2px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; padding: 9px 15px; border-radius: 999px; background: rgba(255,255,255,0.15);
    color: #fff; font-size: 14px; font-weight: 600; border: none; cursor: pointer; white-space: nowrap; transition: background 0.15s; }
  .tab.active { background: var(--lantern); color: #fff; }
  main { max-width: 640px; margin: 0 auto; padding: 18px 14px; }
  .panel { display: none; }
  .panel.active { display: block; animation: fade 0.25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .count { font-size: 13px; color: var(--dim); margin-bottom: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 14px; margin-bottom: 12px; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card-name { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .rating { flex: 0 0 auto; font-size: 13px; font-weight: 700; color: var(--lantern); background: #fff5eb; padding: 2px 8px; border-radius: 8px; }
  .loc { font-size: 13px; color: var(--sea); font-weight: 600; margin-top: 4px; }
  .desc { font-size: 14px; color: var(--ink); margin-top: 8px; }
  .meta { font-size: 12.5px; color: var(--dim); margin-top: 6px; }
  .meta b { color: var(--ink); font-weight: 600; }
  .tel-line { font-size: 12.5px; color: var(--dim); margin-top: 4px; }
  .tip { font-size: 12.5px; color: var(--sea-deep); background: #eef6f7; padding: 7px 10px; border-radius: 8px; margin-top: 8px; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn { flex: 1; text-align: center; padding: 10px; border-radius: 10px; font-size: 14px; font-weight: 700;
    text-decoration: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .btn-map { background: var(--sea); color: #fff; }
  .btn-tel { background: var(--ok); color: #fff; }
  .btn-grab { background: #fff; color: var(--sea); border: 1.5px solid var(--sea); font-size: 12.5px; }
  .check-section { margin-bottom: 22px; }
  .check-section h2 { font-size: 16px; color: var(--sea-deep); font-weight: 700; padding-bottom: 8px; border-bottom: 2px solid var(--line); margin-bottom: 12px; }
  .check-item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; margin-bottom: 9px; }
  .check-item h3 { font-size: 14.5px; font-weight: 700; margin-bottom: 4px; }
  .check-item p { font-size: 13.5px; color: var(--dim); }
  .check-item .hi { color: var(--lantern); font-weight: 700; }
  .check-box { display: flex; align-items: flex-start; gap: 10px; }
  .check-box input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--sea); flex: 0 0 auto; }
  .calc { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .calc-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .calc-row label { font-size: 14px; font-weight: 600; flex: 0 0 62px; }
  .calc-row input { flex: 1; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; font-size: 18px; font-weight: 600; text-align: right; color: var(--ink); }
  .calc-row input:focus { outline: none; border-color: var(--sea); }
  .calc-row span { font-size: 14px; color: var(--dim); flex: 0 0 auto; }
  .calc-note { font-size: 12.5px; color: var(--dim); margin-top: 6px; text-align: center; }
  .calc-quick { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 14px; }
  .calc-quick button { flex: 1; min-width: 64px; padding: 9px; border: 1px solid var(--line); background: var(--sand); border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--sea-deep); cursor: pointer; }
  .phrase { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; margin-bottom: 9px; }
  .phrase .ko { font-size: 14.5px; font-weight: 700; }
  .phrase .vi { font-size: 15px; color: var(--sea); font-weight: 600; margin-top: 3px; }
  .phrase .pron { font-size: 13px; color: var(--dim); margin-top: 2px; }
  .phrase-group { font-size: 14px; font-weight: 700; color: var(--sea-deep); margin: 18px 0 9px; }
  .emergency { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 15px; margin-bottom: 10px; }
  .emergency h3 { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .emergency a { color: var(--ok); font-weight: 700; text-decoration: none; }
  .emergency p { font-size: 13.5px; color: var(--dim); margin-top: 4px; }
  .section-label { font-size: 15px; font-weight: 700; color: var(--sea-deep); margin: 18px 0 10px; }
  .tipcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .tipcard h3 { font-size: 14.5px; font-weight: 700; margin-bottom: 5px; color: var(--sea-deep); }
  .tipcard p { font-size: 13.5px; color: var(--ink); }
  .tipcard .warn { color: #c0392b; font-weight: 600; }
</style>

function showTab(id, btn) {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.getElementById("panel-" + id).classList.add("active");
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function placeCard(p) {
  const rating = p.rating ? `<span class="rating">⭐ ${p.rating}</span>` : "";
  const telLine = p.tel ? `<div class="tel-line">📞 ${p.tel}</div>` : "";
  const tel = p.tel ? `<a class="btn btn-tel" href="tel:${p.tel}">📞 전화</a>` : "";
  const grab = p.grab ? `<span class="btn btn-grab">🛵 Grab 배달</span>` : "";
  const tip = p.tip ? `<div class="tip">💡 ${p.tip}</div>` : "";
  return `<div class="card">
      <div class="card-top"><div class="card-name">${p.name}</div>${rating}</div>
      <div class="loc">📍 ${p.loc}</div>
      <div class="desc">${p.desc}</div>
      <div class="meta">${p.meta}</div>
      ${telLine}${tip}
      <div class="actions"><a class="btn btn-map" href="${p.map}" target="_blank">🗺️ 지도 열기</a>${tel}</div>
      ${grab ? `<div class="actions">${grab}</div>` : ""}
    </div>`;
}
